# DO NOT COMMIT A REAL TOKEN — deploy_local.sh creates this from $GITHUB_TOKEN.
# This file is fully commented so `kubectl apply -f k8s/rollback-controller/`
# ignores it. To create the secret manually:
#
#   kubectl -n default create secret generic github-token \
#     --from-literal=token="$GITHUB_TOKEN"
#
# Equivalent manifest:
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: github-token
#   namespace: default
# type: Opaque
# stringData:
#   token: "REPLACE_ME"
