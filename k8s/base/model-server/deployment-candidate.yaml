apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-candidate
  labels:
    app: model-server
    track: candidate
    version: v1.1.0-candidate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-server
      track: candidate
  template:
    metadata:
      labels:
        app: model-server
        track: candidate
        version: v1.1.0-candidate
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: model-server
          image: ghcr.io/danial-umer710/rollbackops/model-server:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MODEL_VERSION
              value: "v1.1.0-candidate"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
