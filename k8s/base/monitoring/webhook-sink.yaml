apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-sink-script
  namespace: monitoring
data:
  sink.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer


    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length") or 0)
            body = self.rfile.read(length)
            try:
                payload = json.loads(body)
            except (ValueError, UnicodeDecodeError):
                payload = {}
            for alert in payload.get("alerts", []):
                labels = alert.get("labels", {})
                print(
                    "RECEIVED alertname={} status={} model_version={} labels={}".format(
                        labels.get("alertname", "?"),
                        alert.get("status", "?"),
                        labels.get("model_version", "?"),
                        json.dumps(labels, sort_keys=True),
                    ),
                    flush=True,
                )
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(b'{"ok":true}')

        def do_GET(self):
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(b"webhook-sink")

        def log_message(self, format, *args):
            pass


    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-sink
  namespace: monitoring
  labels:
    app: webhook-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-sink
  template:
    metadata:
      labels:
        app: webhook-sink
    spec:
      containers:
        - name: webhook-sink
          image: python:3.12-slim
          command: ["python", "-u", "/app/sink.py"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: webhook-sink-script
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-sink
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: webhook-sink
  ports:
    - name: http
      port: 8080
      targetPort: 8080
