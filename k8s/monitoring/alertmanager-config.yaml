apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 2m
    route:
      receiver: rollback-webhook
      group_by: [alertname, model_version]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
    receivers:
      - name: rollback-webhook
        webhook_configs:
          - url: http://rollback-controller.default.svc.cluster.local:8080/webhook
            send_resolved: false
          - url: http://webhook-sink.monitoring.svc.cluster.local:8080/alert
            send_resolved: true
