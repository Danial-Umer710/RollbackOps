# Requires the AWS Load Balancer Controller installed on the cluster.
# The rollback-controller runs with TRAFFIC_STRATEGY=alb here (see
# rollback-controller-strategy-patch.yaml) and rolls back by rewriting
# the actions.weighted-routing weights to 100/0.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: model-server
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/actions.weighted-routing: |
      {"type":"forward","forwardConfig":{"targetGroups":[
        {"serviceName":"model-server","servicePort":"80","weight":90},
        {"serviceName":"model-candidate","servicePort":"80","weight":10}]}}
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weighted-routing
                port:
                  name: use-annotation
