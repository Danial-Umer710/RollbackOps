name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [model-server, drift-detector, rollback-controller]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: services/${{ matrix.service }}
      - name: Run tests
        run: python -m pytest -q
        working-directory: services/${{ matrix.service }}

  iac:
    runs-on: ubuntu-latest
    env:
      ROLLBACKOPS_MOCK_AWS: "true"
      TG_NON_INTERACTIVE: "true"
      TG_VERSION: "v1.1.1"
    strategy:
      matrix:
        env: [staging, production]
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.6"
      - name: Install Terragrunt
        run: |
          curl -sSfL "https://github.com/gruntwork-io/terragrunt/releases/download/${TG_VERSION}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version
      - name: tofu fmt check
        run: tofu fmt -check -recursive infra/
      - name: terragrunt init
        run: terragrunt init -input=false
        working-directory: infra/environments/${{ matrix.env }}
      - name: terragrunt validate
        run: terragrunt validate
        working-directory: infra/environments/${{ matrix.env }}
      - name: terragrunt plan
        run: terragrunt plan -input=false -lock=false
        working-directory: infra/environments/${{ matrix.env }}

  kustomize:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        overlay: [local, staging]
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: Render overlay
        run: kubectl kustomize "k8s/overlays/${{ matrix.overlay }}" > rendered.yaml
      - name: Validate manifests
        run: kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0 rendered.yaml

  build-and-scan:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [model-server, drift-detector, rollback-controller]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          load: true
          tags: ${{ matrix.service }}:${{ github.sha }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library

  # Proof-of-capability only: disabled until AWS infra is applied (avoids live billing).
  # To enable: apply infra/environments/staging, set repo variables AWS_REGION and
  # AWS_ECR_PUSH_ROLE_ARN (from the `github_actions_role_arn` output), then change `if: false` to
  # the condition below. A follow-up job should run `kustomize edit set image` in
  # k8s/overlays/staging with the pushed tags before any staging deploy.
  # `if: github.ref == 'refs/heads/main' && github.event_name == 'push'`.
  build-and-push-ecr:
    if: false
    needs: [test, build-and-scan]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service: [model-server, drift-detector, rollback-controller]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: rollbackops-ci-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          # provenance disabled: ECR immutable tags + manifest lists don't mix well
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/rollbackops/${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
